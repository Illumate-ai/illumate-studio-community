name: Feature request
description: Ask for a new feature or a change to Illumate Studio.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This issue is public. Do not include your email address, your password or other personal data.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Tell us about the work that you want to do, and what stops you now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What change do you suggest?
    validations:
      required: false
